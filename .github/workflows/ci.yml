name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # 'stable' rather than a pinned patch version — recent Go stdlib
          # CVEs (net/http, crypto/tls, encoding/xml, encoding/asn1) are
          # only fixed in patch releases; floating on "latest stable" keeps
          # CI on a patched toolchain automatically.
          go-version: 'stable'
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o quell ./cmd/quell

      - name: Build public compile package
        run: go build ./compile/...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
